version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_hospital_dragon
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: hospital_dragon
      MYSQL_USER: user_dragon
      MYSQL_PASSWORD: password123
    ports:
      - "3306:3306"
    volumes:
      - ./db:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: